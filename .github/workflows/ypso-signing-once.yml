name: One-time Ypso simulator signing setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy-signing-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.4'
      - name: Install pinned certificate decoder
        run: gem install fastlane --version 2.236.1 --no-document
      - name: Repackage only the existing distribution certificate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_tmp=$(mktemp -d)
          export TASK_SIGNING_TMP="$task_tmp"
          trap 'rm -rf "$task_tmp"' EXIT
          for extension in cer p12; do
            gh api "repos/sejkoramartin/Match-Secrets/contents/certs/distribution/D2TALWT6Z7.$extension" --jq .content | base64 --decode > "$task_tmp/D2TALWT6Z7.$extension"
          done
          ruby <<'RUBY'
          require 'match'
          require 'openssl'
          require 'securerandom'
          require 'base64'
          dir = ENV.fetch('TASK_SIGNING_TMP')
          Match::Encryption::OpenSSL.new(working_directory: dir).decrypt_files
          certificate = OpenSSL::X509::Certificate.new(File.binread(File.join(dir, 'D2TALWT6Z7.cer')))
          archive = OpenSSL::PKCS12.new(File.binread(File.join(dir, 'D2TALWT6Z7.p12')), '')
          abort 'Certificate mismatch' unless archive.certificate.to_der == certificate.to_der
          abort 'Private key mismatch' unless certificate.check_private_key(archive.key)
          abort 'Unexpected team' unless certificate.subject.to_a.any? { |name, value, _| name == 'OU' && value == 'WVWA4MGT8R' }
          abort 'Expired certificate' unless certificate.not_after > Time.now
          password = SecureRandom.hex(32)
          repackaged = OpenSSL::PKCS12.create(password, 'Ypso simulator signing', archive.key, certificate, archive.ca_certs)
          File.write(File.join(dir, 'password'), password, mode: 'w', perm: 0600)
          File.write(File.join(dir, 'p12-base64'), Base64.strict_encode64(repackaged.to_der), mode: 'w', perm: 0600)
          RUBY
          gh secret set P12_PASSWORD --repo sejkoramartin/YpsoPumpKit < "$task_tmp/password"
          gh secret set DISTRIBUTION_P12 --repo sejkoramartin/YpsoPumpKit < "$task_tmp/p12-base64"
          echo 'Signing certificate stored in the two destination secrets.'

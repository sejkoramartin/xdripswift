name: Garmin upstream macOS verification
on:
  push:
    branches: [codex/garmin-macos-verification]
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: garmin
            revision: 77143e99d0d92742bde6269f0bd855f35bcf201e
          - label: upstream
            revision: c268542e64626c564e626658fa9a6b90a059ada4
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
          submodules: recursive
      - name: Record environment
        run: |
          mkdir -p verification-logs
          { git rev-parse HEAD; sw_vers; xcodebuild -version; } | tee verification-logs/environment.log
      - name: Resolve dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project xdrip.xcodeproj -scheme xdrip -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" 2>&1 | tee verification-logs/resolve.log
      - name: Test on one matching iOS simulator
        timeout-minutes: 22
        run: |
          set -o pipefail
          xcrun simctl list devices available -j > verification-logs/simulators.json
          simulator=$(python3 -c 'import json; d=json.load(open("verification-logs/simulators.json")); print(next(v["udid"] for k,vs in d["devices"].items() if k.endswith("iOS-26-2") for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project xdrip.xcodeproj -scheme xdrip -configuration Debug -destination "platform=iOS Simulator,id=$simulator" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 30 -maximum-test-execution-time-allowance 60 -derivedDataPath "$RUNNER_TEMP/simulator-build" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath verification-logs/upstream-tests.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test 2>&1 | tee verification-logs/simulator-tests.log
      - name: Extract test summary
        if: always()
        run: |
          if [ -d verification-logs/upstream-tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path verification-logs/upstream-tests.xcresult --format json > verification-logs/test-summary.json
          fi
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: garmin-macos-${{ matrix.label }}
          path: verification-logs
          retention-days: 14
